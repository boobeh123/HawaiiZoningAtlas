name: Pull and Validate Spreadsheet Data

# Pulls the research spreadsheet (read-only). When it has changed, this
# rebuilds the map data, checks it, and pushes it to main, which Netlify
# deploys. If any step fails, nothing is pushed and GitHub emails the repo
# owner. See CLAUDE.md, Data pipeline.

on:
  workflow_dispatch: {}
  schedule:
    # Mondays at 10:00 UTC, which is midnight in Hawaii
    - cron: "0 10 * * 1"

permissions:
  contents: write

# Never run two syncs at once
concurrency:
  group: spreadsheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            data-pipeline/requirements.txt
            data-pipeline/csv-validation/requirements.txt

      - name: Pull the spreadsheet
        working-directory: data-pipeline
        run: python pull_sheet.py --message "$RUNNER_TEMP/commit-message.txt"

      - name: Validate the CSV
        working-directory: data-pipeline/csv-validation
        run: |
          pip install -r requirements.txt
          python validation.py ../hawaii-zoning-data.csv

      - name: Check whether the spreadsheet changed
        id: changes
        run: |
          if git diff --quiet -- data-pipeline/hawaii-zoning-data.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The spreadsheet hasn't changed, so there's nothing to push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the map data
        if: steps.changes.outputs.changed == 'true'
        working-directory: data-pipeline
        run: |
          pip install -r requirements.txt
          jupyter execute CombineJurisdictions.ipynb
          cp final.geojson ../data/final.geojson

      - name: Check the map data
        if: steps.changes.outputs.changed == 'true'
        run: python data-pipeline/check_data.py

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/hawaii-zoning-data.csv data-pipeline/final.geojson data-pipeline/final.csv data/final.geojson
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push
